name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  [Hugo](https://gohugo.io/) theme **v$RESOLVED_VERSION**. This release incorporates some improvements and fixes.
  
  $CHANGES

  This release note has been generated automatically by [Release Drafter](https://github.com/marketplace/actions/release-drafter).

categories:
- title: 'Breaking Changes'
  label: 'breaking-change'

- title: 'New Features & Enhancements'
  labels:
  - 'feature'
  - 'enhancement'

- title: 'Translations'
  label: 'translation'

- title: 'Bug Fixes'
  labels:
  - 'bug'
  - 'bug-fix'

version-resolver:
  major:
    labels:
    - 'breaking-change'
    - 'breaking'
  minor:
    labels:
    - 'feature'
    - 'enhancement'
    - 'translation'
  patch:
    labels:
    - 'bug'
    - 'bug-fix'
